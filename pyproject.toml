[project]
name = "PhysML"
version = "0.1.0"
description = ""
authors = [
    {name="Daniel Springer", email="daniel.springer@tuwien.ac.at"}, 
    {name="Sebastian Hepp", email="e1015083@student.tuwien.ac.at"},
]
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "h5py ==3.12.*",
    "info-nce-pytorch ==0.1.*",
    "lightning ==2.8.*",
    "matplotlib ==3.10.*",
    "numpy ==2.2.*",
    "pandas ==2.2.*",
    "scikit-learn ==1.6.*",
    "scipy ==1.14.*",
    "seaborn ==0.13.*",
    "tensorboard ==2.18.*",
    "tqdm ==4.67.*",
    "torch ==2.5.*",
    "torchvision ==0.20.*",
    "nest-asyncio>=1.6.0",
]

[tool.uv.sources]
torch = { index = "torch" }
torchvision = { index = "torch" }

[[tool.uv.index]]
name = "torch"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
